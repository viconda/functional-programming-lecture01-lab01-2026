line-length = 88
target-version = "py312"
# Буквальный исходник преподавателя сохраняется без исправления стиля.
extend-exclude = ["impure_examples.py", "scholarship_original.py"]

[lint]
select = ["E", "F", "W", "I", "RUF100"]
ignore = ["E501"]

[lint.per-file-ignores]
# Дополнительное задание прямо требует определений только через lambda.
"church.py" = ["E731"]
